[package]
name = "promoforge-storage"
version = "0.1.0"
edition = "2021"

[dependencies]
promoforge-core = { path = "../core" }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
