[package]
name = "promoforge-api"
version = "0.1.0"
edition = "2021"

[dependencies]
promoforge-core = { path = "../core" }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
